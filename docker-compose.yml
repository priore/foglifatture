services:
  app:
    build: .
    restart: unless-stopped
    env_file: backend/.env
    environment:
      - PORT=1969
    volumes:
      - app-data:/app/backend/data
    expose:
      - "1969"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  app-data:
  caddy-data:
  caddy-config:
