name: hooks-check
on:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Controlla file sensibili e dati personali nel diff della PR
        run: sh scripts/git-hooks/pre-commit --range "origin/${{ github.base_ref }}..HEAD"
